name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install native test dependencies
        run: >-
          dnf install -y
          checkpolicy diffutils gcc git libsepol-devel
          pkgconf-pkg-config python3

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Verify tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$package_version"
          test "v$package_version" = "$RELEASE_TAG"

      - name: Verify workspace metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify generated CLI assets
        run: cargo run -p setools-xtask -- check

      - name: Verify benchmark scenario manifest
        run: python3 scripts/benchmark-cli.py --list

  package-and-publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install package smoke-test tools
        run: sudo apt-get update && sudo apt-get install -y checkpolicy file

      - name: Compile smoke-test policy
        run: >-
          checkpolicy -M -U reject
          -o "$RUNNER_TEMP/setools-test.policy"
          crates/setools-sepol/tests/fixtures/te.conf

      - name: Build and verify pure Rust portable archive
        run: scripts/build-portable-release.sh --policy "$RUNNER_TEMP/setools-test.policy"

      - name: Verify archive checksum
        run: >-
          cd dist && sha256sum --check
          setools-rs-4.7.1-x86_64-linux-pure-rust-static.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: setools-rs-${{ env.RELEASE_TAG }}-x86_64-linux-pure-rust-static
          path: dist/setools-rs-*-x86_64-linux-pure-rust-static.tar.gz*
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          assets=(dist/*.tar.gz dist/*.tar.gz.sha256)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --title "setools-rs ${tag#v}" \
              --generate-notes
          fi
