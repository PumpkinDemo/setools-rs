name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install native test dependencies
        run: >-
          dnf install -y
          checkpolicy diffutils gcc git libsepol-devel
          pkgconf-pkg-config python3

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Verify tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$package_version"
          test "v$package_version" = "$RELEASE_TAG"

      - name: Verify workspace metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify generated CLI assets
        run: cargo run -p setools-xtask -- check

      - name: Verify benchmark scenario manifest
        run: python3 scripts/benchmark-cli.py --list

      - name: Compile cross-platform smoke-test policy
        run: |
          mkdir -p target/release-smoke-policy
          checkpolicy -M -U reject \
            -o target/release-smoke-policy/setools-test.policy \
            crates/setools-sepol/tests/fixtures/te.conf

      - uses: actions/upload-artifact@v4
        with:
          name: release-smoke-policy
          path: target/release-smoke-policy/setools-test.policy
          if-no-files-found: error

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: setools-rs-4.7.1-linux-x86_64
            script: scripts/build-portable-release.sh
          - runner: macos-15-intel
            artifact: setools-rs-4.7.1-macos-x86_64
            script: scripts/build-macos-release.sh
          - runner: macos-15
            artifact: setools-rs-4.7.1-macos-arm64
            script: scripts/build-macos-release.sh
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y checkpolicy file

      - uses: actions/download-artifact@v4
        with:
          name: release-smoke-policy
          path: target/release-smoke-policy

      - name: Build and verify release archive
        run: >-
          ${{ matrix.script }}
          --policy target/release-smoke-policy/setools-test.policy

      - name: Verify archive checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check "${{ matrix.artifact }}.tar.gz.sha256"
          else
            shasum -a 256 --check "${{ matrix.artifact }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-setools-rs-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          assets=(
            dist/setools-rs-4.7.1-linux-x86_64.tar.gz
            dist/setools-rs-4.7.1-linux-x86_64.tar.gz.sha256
            dist/setools-rs-4.7.1-macos-x86_64.tar.gz
            dist/setools-rs-4.7.1-macos-x86_64.tar.gz.sha256
            dist/setools-rs-4.7.1-macos-arm64.tar.gz
            dist/setools-rs-4.7.1-macos-arm64.tar.gz.sha256
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --title "setools-rs ${tag#v}" \
              --generate-notes
          fi
