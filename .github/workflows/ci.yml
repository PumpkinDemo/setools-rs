name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install native dependencies
        run: >-
          dnf install -y
          checkpolicy diffutils gcc git libsepol-devel
          pkgconf-pkg-config python3

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Verify workspace metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify generated CLI assets
        run: cargo run -p setools-xtask -- check

      - name: Verify benchmark scenario manifest
        run: python3 scripts/benchmark-cli.py --list

      - name: Build release binaries
        run: >-
          cargo build --release -p setools-cli
          --bin sesearch --bin seinfo --bin sediff
          --bin sedta --bin seinfoflow --bin sechecker

      - name: Compile cross-platform smoke-test policy
        run: |
          mkdir -p target/ci-smoke-policy
          checkpolicy -M -U reject \
            -o target/ci-smoke-policy/setools-test.policy \
            crates/setools-sepol/tests/fixtures/te.conf

      - uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-policy
          path: target/ci-smoke-policy/setools-test.policy
          if-no-files-found: error

  portable-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install release build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential checkpolicy file

      - name: Compile smoke-test policy
        run: >-
          checkpolicy -M -U reject
          -o "$RUNNER_TEMP/setools-test.policy"
          crates/setools-sepol/tests/fixtures/te.conf

      - name: Build and verify portable archive
        run: scripts/build-portable-release.sh --policy "$RUNNER_TEMP/setools-test.policy"

      - name: Verify archive checksum
        run: >-
          cd dist && sha256sum --check
          setools-rs-4.7.1-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: setools-rs-4.7.1-linux-x86_64
          path: dist/setools-rs-4.7.1-linux-x86_64.tar.gz*
          if-no-files-found: error

  macos-release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: ci-smoke-policy
          path: target/ci-smoke-policy

      - name: Build and verify macOS archive
        run: >-
          scripts/build-macos-release.sh
          --policy target/ci-smoke-policy/setools-test.policy

      - name: Verify archive checksum
        run: >-
          cd dist && shasum -a 256 --check
          setools-rs-4.7.1-macos-${{ matrix.arch }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: setools-rs-4.7.1-macos-${{ matrix.arch }}
          path: dist/setools-rs-4.7.1-macos-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
