[empty]
desc = empty attribute passes
check_type = empty_typeattr
attr = empty_attr

[missing]
check_type = empty_typeattr
attr = optional_attr
missing_ok = yes

[te]
check_type = assert_te
source = te_source
target = te_target
tclass = file
perms = read
expect_source = te_source
expect_target = te_target

[rbac]
check_type = assert_rbac
source = source_role
target = target_role
expect_source = source_role
expect_target = target_role

[executables]
check_type = ro_execs
exempt_write_domain = writer

[modules]
check_type = ro_kmods
exempt_write_domain = writer

[disabled]
check_type = empty_typeattr
attr = nonempty_attr
disable = accepted exception
