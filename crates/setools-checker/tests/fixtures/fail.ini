[nonempty]
check_type = empty_typeattr
attr = nonempty_attr

[te_rule]
check_type = assert_te
source = te_source
target = te_target
tclass = file
perms = read

[te_missing]
check_type = assert_te
tclass = file
perms = execute_no_trans
expect_source = expected_but_absent

[rbac_rule]
check_type = assert_rbac
source = source_role
target = target_role

[rbac_missing]
check_type = assert_rbac
source = source_role
expect_target = absent_role

[executables]
check_type = ro_execs

[modules]
check_type = ro_kmods
