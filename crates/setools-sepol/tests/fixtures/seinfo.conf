class infoflow
class infoflow2

sid kernel
sid security

common infoflow
{
	read
	write
}

class infoflow
inherits infoflow

class infoflow2
inherits infoflow
{
	transition
}

default_user infoflow source;
default_role infoflow2 target;

sensitivity low_s;
sensitivity high_s alias high_alias;
dominance { low_s high_s }

category c0;
category c1 alias category_alias;
level low_s:c0;
level high_s:c0.c1;

mlsconstrain infoflow read (l1 domby l2);

attribute domain;
type system, domain;
type bounded_parent;
type bounded_child;
typebounds bounded_parent bounded_child;
type permissive_example;
permissive permissive_example;

role system;
role system types system;

allow system self:infoflow read;
policycap network_peer_controls;

user system roles system level low_s:c0 range low_s:c0 - high_s:c0.c1;

constrain infoflow write (u1 == u2);
validatetrans infoflow (u1 == u2);

sid kernel system:system:system:low_s:c0
sid security system:system:system:high_s:c0.c1

fs_use_trans devpts system:object_r:system:low_s:c0;
fs_use_xattr ext4 system:object_r:system:low_s:c0;
fs_use_task pipefs system:object_r:system:low_s:c0;

genfscon proc / system:object_r:system:low_s:c0
genfscon proc /sys system:object_r:system:high_s:c0.c1

portcon tcp 80 system:object_r:system:low_s:c0
netifcon eth0 system:object_r:system:low_s:c0 system:object_r:system:low_s:c0
nodecon 127.0.0.1 255.255.255.255 system:object_r:system:low_s:c0
nodecon ::1 ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff system:object_r:system:low_s:c0

ibpkeycon fe80:: 0x0010 system:object_r:system:low_s:c0
ibendportcon mlx5_0 1 system:object_r:system:low_s:c0
