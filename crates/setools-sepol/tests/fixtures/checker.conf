# Synthetic sechecker policy fixture owned by setools-rs.

class file
class system

sid kernel
sid security

class file
{
    read
    write
    append
    execute
    execute_no_trans
}

class system
{
    module_load
}

sensitivity s0;
dominance { s0 }
category c0;
level s0:c0;

mlsconstrain file read (l1 domby l2);

type system;
role system;
role system types system;

attribute empty_attr;
attribute nonempty_attr;
type attribute_member, nonempty_attr;

type te_source;
type te_target;
type expected_but_absent;
allow te_source te_target:file read;

type exec_domain;
type writer;
type executable;
allow exec_domain executable:file execute;
allow writer executable:file write;

type loader;
type kernel_module;
allow loader kernel_module:system module_load;
allow writer kernel_module:file append;

role source_role;
role target_role;
role absent_role;
allow source_role target_role;

user system roles system level s0:c0 range s0:c0;
sid kernel system:system:system:s0:c0
sid security system:system:system:s0:c0
