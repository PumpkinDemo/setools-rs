# Synthetic information-flow fixture owned by setools-rs.

class channel

sid kernel
sid security

class channel
{
    read_low
    read_medium
    write_low
    write_high
    bidirectional
    no_flow
}

sensitivity s0;
dominance { s0 }
category c0;
level s0:c0;

mlsconstrain channel write_high (l1 domby l2);

type system;
role system;
role system types system;

type flow_source;
type middle;
type flow_target;
type low_target;
type inbound;
type flow_true;
type flow_false;
type ignored;

bool enabled false;

# The two rules contribute to the same flow_source -> middle edge.
allow flow_source middle:channel write_low;
allow middle flow_source:channel read_medium;

allow middle flow_target:channel write_high;
allow flow_source low_target:channel write_low;
allow inbound flow_source:channel write_high;
allow flow_source ignored:channel no_flow;

if (enabled) {
    allow flow_source flow_true:channel write_high;
} else {
    allow flow_source flow_false:channel write_high;
}

user system roles system level s0:c0 range s0:c0;
sid kernel system:system:system:s0:c0
sid security system:system:system:s0:c0
