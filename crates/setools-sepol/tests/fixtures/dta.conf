# Synthetic domain-transition fixture owned by setools-rs.

class process
class file

sid kernel
sid security

class process
{
    transition
    dyntransition
    setexec
    setcurrent
}

class file
{
    execute
    entrypoint
}

sensitivity s0;
dominance { s0 }
category c0;
level s0:c0;

mlsconstrain process transition (l1 domby l2);

type system;
role system;
role system types system;

# Automatic standard transition: alpha -> beta.
type alpha;
type beta;
type beta_exec;
allow alpha beta:process transition;
allow alpha beta_exec:file execute;
allow beta beta_exec:file entrypoint;
type_transition alpha beta_exec:process beta;

# setexec standard transition: beta -> gamma.
type gamma;
type gamma_exec;
allow beta self:process setexec;
allow beta gamma:process transition;
allow beta gamma_exec:file execute;
allow gamma gamma_exec:file entrypoint;

# Automatic standard transition: gamma -> delta.
type delta;
type delta_exec;
allow gamma delta:process transition;
allow gamma delta_exec:file execute;
allow delta delta_exec:file entrypoint;
type_transition gamma delta_exec:process delta;

# Dynamic branch: alpha -> dynamic -> delta.
type dynamic;
type dynamic_exec;
allow alpha self:process setcurrent;
allow alpha dynamic:process dyntransition;
allow dynamic self:process { setexec setcurrent };
allow dynamic delta:process { transition dyntransition };
allow dynamic dynamic_exec:file execute;
allow delta dynamic_exec:file entrypoint;
type_transition dynamic dynamic_exec:process delta;

# Incomplete candidates must not become graph edges.
type invalid_standard;
allow alpha invalid_standard:process transition;
type invalid_dynamic_source;
type invalid_dynamic_target;
allow invalid_dynamic_source invalid_dynamic_target:process dyntransition;

user system roles system level s0:c0 range s0:c0;
sid kernel system:system:system:s0:c0
sid security system:system:system:s0:c0
