class resource

sid kernel
sid security

class resource
{
	use
}

sensitivity s0;
dominance { s0 }

category c0;
level s0:c0;

mlsconstrain resource use (l1 eq l2);

type system;
role system;
role system types system;

allow system self:resource use;

user system roles system level s0:c0 range s0:c0;

sid kernel system:system:system:s0:c0
sid security system:system:system:s0:c0

devicetreecon /soc/device system:system:system:s0:c0
iomemcon 0x10-0x12 system:system:system:s0:c0
ioportcon 0x20-0x22 system:system:system:s0:c0
pcidevicecon 0x30 system:system:system:s0:c0
pirqcon 40 system:system:system:s0:c0
